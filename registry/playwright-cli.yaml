id: playwright-cli
name: Playwright CLI
kind: cli
what: "When: install browsers, codegen, or run Playwright scripts across Chromium/Firefox/WebKit. Not for one-shot page grab (moli) or LLM-ready crawl/markdown (crawl4ai)."
homepage: https://playwright.dev
install:
  docs: https://playwright.dev/docs/intro
  macos: npm exec -- playwright --version || npx --yes playwright@latest --version
  linux: npm exec -- playwright --version || npx --yes playwright@latest --version
init: playwright install
bin: playwright
entry: playwright
config:
  - PLAYWRIGHT_BROWSERS_PATH
deps: []
checks:
  installed: playwright --version
platforms: [macos, linux, windows]
notes: Large browser downloads; set PLAYWRIGHT_BROWSERS_PATH for a shared cache.
