id: playwright-cli
name: Playwright CLI
kind: cli
what: Official Playwright CLI for browser install, codegen, and scripted automation.
homepage: https://playwright.dev
install:
  docs: https://playwright.dev/docs/intro
  macos: npm exec -- playwright --version || npx --yes playwright@latest --version
init: playwright install
bin: playwright
entry: playwright
config:
  - PLAYWRIGHT_BROWSERS_PATH
deps: []
checks:
  installed: playwright --version
platforms: [macos, linux, windows]
notes: Browsers are large; set PLAYWRIGHT_BROWSERS_PATH for a shared cache when agents share a host.
