id: moli
name: Moli
kind: cli
what: Headless Chromium-compatible browser with CDP; fetch/search/screenshot without a GUI.
homepage: https://github.com/lexmount/moli
install:
  macos: |
    curl --proto '=https' --tlsv1.2 -fsSL \
      https://github.com/lexmount/moli/releases/latest/download/moli-installer.sh | sh
  linux: |
    curl --proto '=https' --tlsv1.2 -fsSL \
      https://github.com/lexmount/moli/releases/latest/download/moli-installer.sh | sh
  docs: https://github.com/lexmount/moli
bin: moli
config:
  - PATH
deps: []
checks:
  installed: moli --version
platforms: [macos, linux]
notes: Upstream installer should put `moli` on PATH. CDP often at http://127.0.0.1:9222.
