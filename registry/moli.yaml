id: moli
name: Moli
kind: cli
what: "When: need a lean headless Chromium for agents (fetch URL, screenshot, eval JS, or CDP) without Playwright. Not for multi-page LLM markdown extract (use crawl4ai) or codegen/tests (use playwright-cli)."
homepage: https://github.com/lexmount/moli
install:
  macos: |
    curl --proto '=https' --tlsv1.2 -fsSL \
      https://github.com/lexmount/moli/releases/latest/download/moli-installer.sh | sh
  linux: |
    curl --proto '=https' --tlsv1.2 -fsSL \
      https://github.com/lexmount/moli/releases/latest/download/moli-installer.sh | sh
  docs: https://github.com/lexmount/moli
bin: moli
config:
  - PATH
deps: []
checks:
  installed: moli --version
platforms: [macos, linux]
notes: CDP often at http://127.0.0.1:9222. Prefer over Playwright when you only need fetch/serve/CDP.
